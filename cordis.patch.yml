# dsh-purge bundle patch
#
# 清洗 + 演练台都在本插件内（lib/redteam、presets/redteam、skills/redteam）。
# 只装 dsh-purge，不外接、不 link 其它红队包。

# 关掉旧的独立红队包行（若用户以前装过 dsh-redteam-mode）
- id: redteam-store
  name: dsh-redteam-store
  disabled: true

- id: redteam-ui
  name: dsh-redteam-ui
  disabled: true

- id: redteam-mode
  name: dsh-redteam-mode
  disabled: true

- id: redteam-mode-store
  name: dsh-redteam-mode/store
  disabled: true

- id: redteam-mode-ui
  name: dsh-redteam-mode/ui
  disabled: true

# 0.2.2 起 base bundle 默认插入这一行：走官方 DeepSeek API 时，请求体里会多一个
# dsh_plugin_packages 字段（活跃插件包名 + 版本），本插件也在清单里。
# 关掉只是不再上报这份清单，模型输出/工具/会话都不受影响；
# pluginPackages 服务本身由 dsh-app-boot 提供，别处照常能拿到，不存在连带。
- id: plugin-package-inventory-deepseek
  name: '@deepseek-ai/dsh-plugin-package-inventory-deepseek'
  disabled: true

# 0.2.2 自带的产品埋点。desktop profile 下 `disabled: profileContext.name !== 'desktop'`
# 求值为 false = 启用；endpoint 走 zod 默认值
# https://dsh-otel-collector.deepseeksvc.com/v1/logs（环境变量没设也是这个地址）。
# 关掉只影响 UI 行为统计，本地功能一律不受影响。
- id: desktop-product-telemetry
  name: '@deepseek-ai/dsh-host-product-telemetry-otel'
  disabled: true

- id: product-analytics
  name: '@deepseek-ai/dsh-client-product-analytics'
  disabled: true

# 会话日志遥测默认 mode=FEEDBACK_ONLY：只有你自己点「反馈」才上传，日常活动不采集。
# 想连反馈通道一起断，把下面三行的注释去掉；代价是官方排障时拿不到你的会话前缀。
# - id: session-telemetry-otel
#   name: '@deepseek-ai/dsh-session-telemetry-otel'
#   disabled: true

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: ""

# 本体 insert 写在用户层 profile/cordis.patch.yml（postinstall / 演练台自愈补）。
# 这里只改已入队条目的 inject/config。再 insert 一次会 already queued（#152 / #154 / #159）。
- id: dsh-purge
  name: dsh-purge
  inject: [systemPrompt, tools]
  config:
    enabled: true
    autoApplyOnStart: false
    autoUpdateOnStart: false
    autoRevertOnMissing: false
    injectOnce: false
    stripMnemon: true
    verbose: false
    postPrompt: ""
    postPromptOrder: 5100
    autoRetry: true
    retryMax: 3
    autoContinue: false
    continueMax: 3
    continueText: "继续"
    capabilityProtocol: true
    hooksDenyBypass: true
    anchorMode: auto
    subagentControl: true

- insert:
    # 演练台：预设 + 技能落地（本插件 lib/redteam）
    - id: dsh-purge-redteam
      name: dsh-purge/redteam

    # 演练台事实库（SQLite），数据在 $DSH_HOME/redteam
    - id: dsh-purge-redteam-store
      name: dsh-purge/redteam/store
      config:
        root: !!js dshHomePath('redteam')

    # 演练台 HTTP 桥 POST /redteam/api
    - id: dsh-purge-redteam-ui
      name: dsh-purge/redteam/ui
